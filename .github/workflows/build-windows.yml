name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: MSYS2 MINGW64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-jsoncpp
            mingw-w64-x86_64-fmt
            mingw-w64-x86_64-spdlog
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-libsigc++

      # MSYS2 已把 GTK3 C++ 绑定从索引中下架，只能用固定版本包安装。
      # 版本与 scripts/bootstrap-msys2.ps1 保持一致。
      - name: Install gtkmm3 stack (pinned)
        run: |
          pacman -U --noconfirm \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-libsigc%2B%2B-2.12.2-1-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-glibmm-2.66.10-1-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-cairomm-1.14.6-1-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-pangomm-2.46.4-2-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-atkmm-2.28.5-1-any.pkg.tar.zst \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-gtkmm3-3.24.10-3-any.pkg.tar.zst

      - name: Configure
        run: meson setup build --buildtype=release -Dtests=enabled

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Package (portable zip)
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild -Configuration release

      - name: Build installer
        shell: pwsh
        run: ./scripts/make-installer.ps1 -SkipPayload

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: waybar-windows-x64-portable
          path: dist/waybar-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: waybar-windows-x64-setup
          path: dist/waybar-*-setup-windows-x64.zip
          if-no-files-found: error
